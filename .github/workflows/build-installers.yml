name: Build AI Studio installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:mac
      - uses: actions/upload-artifact@v7
        with:
          name: AI-Studio-macOS-x64
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - uses: actions/upload-artifact@v7
        with:
          name: AI-Studio-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0
